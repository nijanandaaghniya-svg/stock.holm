<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - STOCK.HOLM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcf9f2;
            color: #4a3b32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* HEADER BANNER */
        .login-header {
            background-color: #8b6d5c;
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-header h1 {
            font-size: 2.8rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 1.1rem;
            font-style: italic;
        }

        /* CONTAINER FORM */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background-color: #ffffff;
            border: 2px solid #a68a7a;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            text-align: center;
        }

        .login-card h2 {
            font-size: 2rem;
            color: #4a3b32;
            margin-bottom: 8px;
        }

        .login-card p.sub-text {
            font-size: 0.9rem;
            color: #8b6d5c;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a3b32;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1bfae;
            border-radius: 4px;
            background-color: #fcf9f2;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            color: #4a3b32;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #634b3e;
            background-color: #ffffff;
        }

        /* TOMBOL AKSI */
        .login-btn {
            width: 100%;
            background-color: #634b3e;
            color: #f7f3e9;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #d1bfae;
            color: #4a3b32;
        }

        .back-link {
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .back-link a {
            color: #8b6d5c;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #4a3b32;
            text-decoration: underline;
        }

        footer {
            background-color: #4a3b32;
            color: #eaddd3;
            text-align: center;
            padding: 22px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- ================= HEADER BANNER ================= -->
    <header class="login-header">
        <h1>STOCK.HOLM</h1>
        <p>Your Daily Dose of Elegant Aesthetics</p>
    </header>

    <!-- ================= KONTEN LUPA PASSWORD ================= -->
    <main class="login-container">
        <div class="login-card">
            <h2>Reset Password</h2>
            <p class="sub-text">Enter your registered email address and we will send you instructions to reset your password.</p>

            <form action="#" method="POST" onsubmit="alert('Reset link has been sent to your email.'); return false;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="login-btn">Send Reset Link</button>
            </form>

            <div class="back-link">
                <a href="login.html">&larr; Back to Login</a>
            </div>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
        <p>&copy; 2026 STOCK.HOLM. Designed with elegance.</p>
    </footer>

</body>
</html>
